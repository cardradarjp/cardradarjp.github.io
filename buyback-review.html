<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><meta name="theme-color" content="#f5f5f7"><title>買取リスト 画像照合</title><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--sub:#6e6e73;--line:#dedee3;--blue:#007aff;--yes:#15803d;--no:#c62828;--chip:#efeff4;--warn:#9a6700}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#aaa;--line:#38383a;--blue:#0a84ff;--yes:#30d158;--no:#ff453a;--chip:#2c2c2e;--warn:#ffd60a}}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.w{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}.H{padding:9px 2px 7px;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}h1{font-size:20px;margin:0 0 7px}.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}.bar>div{height:100%;background:var(--blue);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px}.stat b{display:block;font-size:16px}.stat span{font-size:9px;color:var(--sub)}.photo,.card,details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:9px}.photo{overflow:hidden}.ph{display:flex;justify-content:space-between;padding:9px 11px;font-size:12px;color:var(--sub)}.ph b{color:var(--text);font-size:13px}.photo img{display:block;width:100%;height:auto;max-height:54vh;object-fit:contain;background:#111;cursor:zoom-in}.pn{font-size:10px;color:var(--sub);padding:7px 10px 9px}.card{padding:16px 15px}.num{font-size:11px;color:var(--sub)}.name{font-size:28px;font-weight:850;line-height:1.16;margin:6px 0 10px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--chip);padding:6px 8px;border-radius:999px;font-size:12px;font-weight:650}.spec{margin-top:10px;color:var(--sub);font-size:13px}.same{display:none;margin-top:9px;font-size:11px;color:var(--warn);font-weight:700}.qtyrow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.ql{font-size:12px;color:var(--sub)}.step{display:flex;align-items:center;gap:9px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:23px}.qnum{min-width:45px;text-align:center;font-size:23px;font-weight:850}.price{font-size:12px;color:var(--sub);margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.actions button{border:0;border-radius:15px;padding:16px 10px;font-size:17px;font-weight:850;color:white}#yes{background:var(--yes)}#no{background:var(--no)}.sub{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.sub button,.exp button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 7px;font-size:13px}.state{margin-top:7px;font-size:11px;color:var(--sub);text-align:center;min-height:16px}.done{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 15px;margin-top:9px}.done h2{margin:0 0 8px}.done p{font-size:13px;color:var(--sub)}.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;color:var(--no);font-size:13px}details{overflow:hidden}summary{padding:12px 13px;font-weight:750;font-size:14px}.tools{padding:0 11px 9px}#search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font-size:16px}.mini{max-height:310px;overflow:auto;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:51px 1fr auto;gap:7px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px}.row button{border:0;background:none;color:var(--blue);text-align:left;padding:0}.badge{font-size:10px;padding:4px 6px;border-radius:999px;background:var(--chip)}.reset{margin-top:13px;width:100%;border:0;background:none;color:var(--no);padding:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;overflow:auto}.modal.open{display:block}.modal img{display:block;width:1200px;height:auto;max-width:none;margin:55px auto 20px}.close{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:101;border:0;border-radius:999px;background:#fff;color:#111;width:40px;height:40px;font-size:21px}.hidden{display:none!important}
</style></head><body><div class="w"><div class="H"><h1>元画像と候補名を照合</h1><div class="pl"><span id="pt">準備中…</span><span id="sv">自動保存</span></div><div class="bar"><div id="bar"></div></div><div class="stats"><div class="stat"><b id="ok">0</b><span>合ってる</span></div><div class="stat"><b id="ng">0</b><span>違う</span></div><div class="stat"><b id="val">¥0</b><span>合ってる分</span></div></div></div><div id="err"></div>
<section class="photo" id="photo"><div class="ph"><b id="src"></b><span>タップで拡大</span></div><img id="img"><div class="pn">この元画像から認識した候補です。画像と候補名が同じかだけ確認してください。</div></section>
<section class="card" id="card"><div class="num" id="num"></div><div class="name" id="name"></div><div class="chips"><span class="chip" id="rar"></span><span class="chip" id="code"></span><span class="chip" id="srcchip"></span></div><div class="spec" id="spec"></div><div class="same" id="same">同名候補があります。画像・型番も確認してください。</div><div class="qtyrow"><div><div class="ql">現在の登録枚数</div><div class="price" id="price"></div></div><div class="step"><button id="minus">−</button><div class="qnum" id="qty"></div><button id="plus">＋</button></div></div></section>
<div class="actions" id="actions"><button id="no">違う</button><button id="yes">合ってる</button></div><div class="sub" id="sub"><button id="prev">← 前へ</button><button id="later">あとで</button><button id="next">次へ →</button></div><div class="state" id="state"></div>
<section class="done" id="done"><h2>照合完了</h2><p id="doneText"></p><div class="exp"><button id="copy">結果をコピー</button><button id="share">共有</button></div><p>結果をこのチャットに貼れば、違うカードだけこちらで修正します。</p></section>
<details><summary>一覧から探す</summary><div class="tools"><input id="search" type="search" placeholder="カード名・型番・画像名"></div><div class="mini" id="mini"></div></details><button class="reset" id="reset">確認状態をリセット</button></div>
<div class="modal" id="modal"><button class="close" id="close">×</button><img id="mi"></div>
<script>
const RAW='https://raw.githubusercontent.com/cardradarjp/cardradarjp.github.io/00ddd46c6760ae292b43388d4ee3ba3bfcc80eca/buyback-list.html';const KEY='buybackImageReview20260826v2';let D=[],S={},idx=0;const $=s=>document.querySelector(s),fmt=n=>'¥'+Number(n||0).toLocaleString(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function srcOf(n){if(n<=127)return'IMG_0800';if(n<=142)return'IMG_0801';if(n<=157)return'IMG_0802';if(n<=172)return'IMG_0803';if(n<=187)return'IMG_0804';if(n<=201)return'IMG_0805';if(n<=213)return'IMG_0806';if(n<=227)return'IMG_0807';if(n<=237)return'IMG_0808';return'IMG_0810'}
function extract(t){let p=t.indexOf('const D='),s=t.indexOf('[',p),d=0,q=false,e=false;if(p<0||s<0)throw Error('data not found');for(let i=s;i<t.length;i++){let c=t[i];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false}else{if(c==='"')q=true;else if(c==='[')d++;else if(c===']'){if(!--d)return JSON.parse(t.slice(s,i+1))}}}throw Error('data incomplete')}
function loadState(){try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#sv').textContent='自動保存済み'}catch(e){$('#sv').textContent='保存不可'}}function ent(z){return S[z.n]||(S[z.n]={s:'',q:z.q})}function imgURL(z){return'assets/review-hq/'+z.src+'.jpg?v=20260826-2'}function first(start=0){for(let k=0;k<D.length;k++){let j=(start+k)%D.length;if(!ent(D[j]).s)return j}return-1}
function render(){let r=0,ok=0,ng=0,val=0;for(const z of D){let a=ent(z);if(a.s)r++;if(a.s==='y'){ok++;val+=a.q*z.p}if(a.s==='n')ng++}$('#pt').textContent=`${r} / ${D.length}種類 確認済み`;$('#bar').style.width=(r/D.length*100)+'%';$('#ok').textContent=ok;$('#ng').textContent=ng;$('#val').textContent=fmt(val);if(r===D.length){$('#photo').classList.add('hidden');$('#card').classList.add('hidden');$('#actions').classList.add('hidden');$('#sub').classList.add('hidden');$('#done').style.display='block';$('#doneText').textContent=`合ってる ${ok} / 違う ${ng} / 見込み ${fmt(val)}`;return}$('#done').style.display='none';['photo','card','actions','sub'].forEach(x=>$('#'+x).classList.remove('hidden'));let z=D[idx],a=ent(z);$('#src').textContent=z.src;$('#img').src=imgURL(z);$('#num').textContent=`候補 ${idx+1} / ${D.length} ・ No.${z.n}`;$('#name').textContent=z.name;$('#rar').textContent=z.rar;$('#code').textContent=z.code;$('#srcchip').textContent=z.src;$('#spec').textContent=z.spec;$('#same').style.display=D.filter(x=>x.name===z.name).length>1?'block':'none';$('#qty').textContent=a.q;$('#price').textContent=`${fmt(z.p)}/枚 ・ ${a.q}枚なら ${fmt(z.p*a.q)}`;$('#state').textContent=a.s==='y'?'✓ 合ってる':a.s==='n'?'× 違う':'未確認';mini()}
function adv(){let j=first(idx+1);if(j>=0)idx=j;render()}$('#yes').onclick=()=>{ent(D[idx]).s='y';save();adv()};$('#no').onclick=()=>{ent(D[idx]).s='n';save();adv()};$('#later').onclick=()=>{idx=(idx+1)%D.length;render()};$('#prev').onclick=()=>{idx=(idx-1+D.length)%D.length;render()};$('#next').onclick=()=>{idx=(idx+1)%D.length;render()};$('#minus').onclick=()=>{let a=ent(D[idx]);a.q=Math.max(1,a.q-1);save();render()};$('#plus').onclick=()=>{ent(D[idx]).q++;save();render()};
function out(){let y=[],n=[],q=[];for(const z of D){let a=ent(z);if(a.s==='y')y.push(z.n);if(a.s==='n')n.push(z.n);if(a.q!==z.q)q.push(z.n+':'+a.q)}return['画像照合v2','correct='+y.join(','),'wrong='+n.join(','),'qty='+q.join(',')].join('\n')}async function cp(){let t=out();try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){prompt('コピーしてください',t)}}$('#copy').onclick=cp;$('#share').onclick=async()=>{if(navigator.share){try{return await navigator.share({text:out()})}catch(e){}}cp()};
function mini(){let q=$('#search').value.toLowerCase(),h='';D.forEach((z,j)=>{let a=ent(z),b=(z.name+' '+z.code+' '+z.src).toLowerCase();if(q&&!b.includes(q))return;let st=a.s==='y'?'合ってる':a.s==='n'?'違う':'未確認';h+=`<div class=row><span>No.${z.n}</span><button data-i=${j}>${esc(z.name)}<br><small>${esc(z.code)} / ${z.src}</small></button><span class=badge>${st}</span></div>`});$('#mini').innerHTML=h;$('#mini').querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render();scrollTo({top:0,behavior:'smooth'})})}$('#search').oninput=mini;$('#reset').onclick=()=>{if(confirm('照合結果を全部リセットしますか？')){S={};save();idx=0;render()}};const M=$('#modal');$('#img').onclick=()=>{$('#mi').src=$('#img').src;M.classList.add('open')};$('#close').onclick=()=>M.classList.remove('open');M.onclick=e=>{if(e.target===M)M.classList.remove('open')};
(async()=>{try{let r=await fetch(RAW,{cache:'no-store'});if(!r.ok)throw Error(r.status);let a=extract(await r.text()).filter(z=>z[0]>=113&&z[0]<=247);D=a.map(z=>({n:z[0],name:z[1],q:z[2],rar:z[3],code:z[4],p:z[5],spec:z[7],src:srcOf(z[0])}));let s=D.find(z=>z.n===134);if(s){s.q=2}loadState();idx=Math.max(0,first());render()}catch(e){$('#err').innerHTML='<div class=err>データ読込に失敗しました。再読み込みしてください。</div>';$('#photo').style.display=$('#card').style.display=$('#actions').style.display=$('#sub').style.display='none'}})();
</script></body></html>
