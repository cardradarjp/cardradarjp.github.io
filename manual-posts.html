<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <meta name="robots" content="noindex, nofollow">
  <title>CardRadar かんたん登録</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#121722;--panel2:#182131;--text:#f5f7fb;--muted:#9ba7b8;--line:rgba(255,255,255,.1);--accent:#dce7f7;--danger:#ffb4b4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#111722 0,var(--bg) 230px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,680px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom))}
    h1{margin:0;font-size:clamp(25px,7vw,34px)}h2{margin:0 0 10px;font-size:18px}.lead,.note{color:var(--muted);line-height:1.6}.lead{font-size:14px}.note{font-size:12px;margin:10px 0 0}
    section{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(18,23,34,.94)}
    label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700}input,button,textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);font:inherit;padding:12px}
    textarea{min-height:170px;resize:vertical;line-height:1.55}button{margin-top:16px;font-weight:800;background:#e8eef8;color:#10141c}.secondary{background:var(--panel2);color:var(--text)}
    .status{min-height:22px;margin-top:12px;font-size:13px}.error{color:var(--danger)}.detected{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13px;line-height:1.65}
    .list{display:grid;gap:12px}.item{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.meta{font-size:12px;color:var(--muted);line-height:1.6}.url{display:block;margin-top:8px;color:var(--accent);word-break:break-all}.empty{color:var(--muted);font-size:13px}
    .prepared{display:none}.prepared.is-visible{display:block}.actions{display:grid;gap:8px;margin-top:12px}.actions button,.actions a{margin:0;min-height:48px}.actions a{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);font-weight:800;text-decoration:none;padding:12px}
    a.back{display:inline-block;margin-top:18px;color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
<main>
  <header>
    <h1>かんたん登録</h1>
    <p class="lead">X投稿URLだけを受け取り、店舗はアカウントから自動判定します。カテゴリは一旦すべて「未分類」で保存します。</p>
  </header>

  <section>
    <form id="postForm">
      <label for="url">X投稿URL</label>
      <input id="url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/account/status/123..." required>
      <div id="detected" class="detected">URLを入力すると店舗を自動判定します。</div>
      <button type="submit">登録内容を作成</button>
      <p id="status" class="status" aria-live="polite"></p>
    </form>

    <div id="prepared" class="prepared">
      <label for="issueTitle">GitHub Issueのタイトル</label>
      <input id="issueTitle" readonly>
      <button id="copyTitle" class="secondary" type="button">タイトルをコピー</button>

      <label for="issueBody">GitHub Issueの本文</label>
      <textarea id="issueBody" readonly></textarea>
      <button id="copyBody" class="secondary" type="button">本文をコピー</button>

      <div class="actions">
        <a href="https://github.com/cardradarjp/cardradarjp.github.io/issues/new" target="_blank" rel="noopener">GitHubのIssue作成画面を開く</a>
      </div>
      <p class="note">現段階ではGitHub画面へタイトルと本文を貼り付けて送信します。次にiPhoneの共有メニューからこの画面を直接開くショートカットを作ります。</p>
    </div>
  </section>

  <section>
    <h2>登録済みの投稿</h2>
    <div id="list" class="list"><p class="empty">読み込み中です。</p></div>
    <button id="reload" class="secondary" type="button">一覧を再読み込み</button>
  </section>

  <a class="back" href="admin-search.html">← 管理検索へ戻る</a>
</main>
<script>
(() => {
  const storeMap={
    ds_nipponbashi:'ドラスタ日本橋',
    ds_nipponbashi2:'ドラスタ日本橋2号店',
    ds_nipponbashi3:'ドラスタ日本橋3号店',
    AMTAF_SHOP:'アムタフ',
    cardshop_gotcha:'GOTCHA!'
  };
  const form=document.getElementById('postForm');
  const urlInput=document.getElementById('url');
  const detected=document.getElementById('detected');
  const status=document.getElementById('status');
  const list=document.getElementById('list');
  const reload=document.getElementById('reload');
  const prepared=document.getElementById('prepared');
  const issueTitle=document.getElementById('issueTitle');
  const issueBody=document.getElementById('issueBody');
  const copyTitle=document.getElementById('copyTitle');
  const copyBody=document.getElementById('copyBody');

  const normalize=(value)=>{
    try{
      const u=new URL(value.trim());
      if(!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname)) return null;
      const m=u.pathname.match(/^\/([^/]+)\/status\/(\d+)/);
      if(!m) return null;
      return {url:`https://x.com/${m[1]}/status/${m[2]}`,account:m[1],statusId:m[2],store:storeMap[m[1]]||'その他'};
    }catch{return null}
  };

  const updateDetected=()=>{
    const parsed=normalize(urlInput.value);
    if(!urlInput.value.trim()){
      detected.textContent='URLを入力すると店舗を自動判定します。';
      return;
    }
    detected.textContent=parsed?`判定：${parsed.store} / @${parsed.account} / 未分類`:'Xの投稿URLを確認してください。';
  };

  const copy=async(value,button)=>{
    try{await navigator.clipboard.writeText(value);const old=button.textContent;button.textContent='コピーしました';setTimeout(()=>button.textContent=old,1200)}
    catch{status.textContent='コピーできませんでした。入力欄を長押ししてコピーしてください。';status.className='status error'}
  };

  const render=async()=>{
    list.innerHTML='<p class="empty">読み込み中です。</p>';
    try{
      const res=await fetch(`manual_posts.json?t=${Date.now()}`,{cache:'no-store'});
      if(!res.ok) throw new Error('load failed');
      const items=await res.json();
      list.innerHTML='';
      if(!items.length){list.innerHTML='<p class="empty">まだ登録はありません。</p>';return}
      items.slice().reverse().forEach(item=>{
        const card=document.createElement('article');card.className='item';
        const title=document.createElement('strong');title.textContent=`${item.store}｜${item.category}`;
        const meta=document.createElement('div');meta.className='meta';meta.textContent=`@${item.account}｜${new Date(item.registeredAt).toLocaleString('ja-JP')}`;
        const link=document.createElement('a');link.className='url';link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=item.url;
        card.append(title,meta,link);list.appendChild(card);
      });
    }catch{list.innerHTML='<p class="empty">一覧を読み込めませんでした。</p>'}
  };

  form.addEventListener('submit',e=>{
    e.preventDefault();status.textContent='';status.className='status';
    const parsed=normalize(urlInput.value);
    if(!parsed){status.textContent='Xの投稿URLを入力してください。';status.className='status error';return}
    issueTitle.value=`[CardRadar登録] ${parsed.statusId}`;
    issueBody.value=[
      'CardRadar manual post registration','',
      `URL: ${parsed.url}`,
      `STORE: ${parsed.store}`,
      'CATEGORY: 未分類',
      `ACCOUNT: ${parsed.account}`,
      `STATUS_ID: ${parsed.statusId}`
    ].join('\n');
    prepared.classList.add('is-visible');
    status.textContent='登録内容を作成しました。';
    prepared.scrollIntoView({behavior:'smooth',block:'start'});
  });

  urlInput.addEventListener('input',updateDetected);
  copyTitle.addEventListener('click',()=>copy(issueTitle.value,copyTitle));
  copyBody.addEventListener('click',()=>copy(issueBody.value,copyBody));
  reload.addEventListener('click',render);

  const sharedUrl=new URLSearchParams(location.search).get('url');
  if(sharedUrl){urlInput.value=sharedUrl;updateDetected();form.requestSubmit();}
  render();
})();
</script>
</body>
</html>
