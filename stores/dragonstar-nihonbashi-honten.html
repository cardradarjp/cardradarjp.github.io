<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardRadar｜ドラスタ 日本橋本店</title>
<meta name="description" content="CardRadarは、ポケカのシングル買取・BOX買取・定額買取・PSA買取・公式Web買取表・相場確認を探せるサイトです。">
<link rel="icon" type="image/png" href="../icon-512.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #050505;
  color: #f5f5f5;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 15% 13%, rgba(255,255,255,.13), transparent 17%),
    radial-gradient(circle at 22% 25%, rgba(255,255,255,.045), transparent 23%),
    linear-gradient(90deg, rgba(255,255,255,.025), transparent 35%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012), rgba(255,255,255,.012) 1px, transparent 1px, transparent 5px);
  opacity: .8;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent 0%, transparent 70%, rgba(255,255,255,.027) 73%, transparent 77%),
    linear-gradient(90deg, transparent 0%, transparent 80%, rgba(255,255,255,.02) 82%, transparent 86%),
    linear-gradient(180deg, #080808 0%, #030303 100%);
  opacity: .95;
  z-index: -3;
}

a {
  color: inherit;
}

.page-shell {
  min-height: 100vh;
}

.hero {
  padding: 36px 7vw 30px;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-mark {
  font-family: "Times New Roman", serif;
  font-size: 58px;
  letter-spacing: -.16em;
  line-height: .85;
  text-shadow: 0 0 24px rgba(255,255,255,.18);
}

.logo-text {
  font-family: "Times New Roman", serif;
  letter-spacing: .36em;
  font-size: 24px;
  font-weight: 400;
}

.logo-sub {
  margin-top: 5px;
  color: rgba(255,255,255,.48);
  letter-spacing: .28em;
  font-size: 11px;
}

.hero-large {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 36px 7vw;
}

.hero-title {
  margin-top: 42px;
  font-family: "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(36px, 9vw, 76px);
  letter-spacing: .18em;
  line-height: 1.1;
}

.hero-copy {
  margin-top: 24px;
  color: rgba(255,255,255,.78);
  line-height: 2;
  letter-spacing: .1em;
}

.selector-grid {
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.select-card {
  display: block;
  text-decoration: none;
  background: rgba(8,8,8,.76);
  border: 1px solid rgba(255,255,255,.12);
  padding: 28px;
  min-height: 160px;
  transition: border-color .15s ease, transform .15s ease;
}

.select-card:hover {
  border-color: rgba(255,255,255,.32);
  transform: translateY(-2px);
}

.select-card small {
  display: block;
  color: rgba(255,255,255,.45);
  letter-spacing: .28em;
  font-size: 11px;
}

.select-card strong {
  display: block;
  margin-top: 18px;
  font-size: 24px;
  letter-spacing: .12em;
  font-weight: 500;
}

.select-card p {
  margin: 16px 0 0;
  color: rgba(255,255,255,.62);
  font-size: 13px;
  line-height: 1.7;
}

.breadcrumb {
  margin-top: 24px;
  color: rgba(255,255,255,.5);
  font-size: 12px;
  letter-spacing: .12em;
}

.breadcrumb a {
  color: rgba(255,255,255,.7);
  text-decoration: none;
}

.area-title {
  margin-top: 32px;
  font-family: "Times New Roman", serif;
  font-size: clamp(34px, 9vw, 62px);
  letter-spacing: .18em;
  font-weight: 400;
}

.area-description {
  max-width: 720px;
  color: rgba(255,255,255,.72);
  line-height: 1.9;
  letter-spacing: .08em;
}

.sticky-search {
  position: static;
  top: auto;
  z-index: auto;
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.10);
  padding: 14px 7vw;
}

.search-main {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.search-main input {
  width: 100%;
  height: 48px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  padding: 0 14px;
  font-size: 15px;
  outline: none;
}

.reset-button {
  height: 48px;
  border: 1px solid rgba(255,255,255,.16);
  background: transparent;
  color: white;
  padding: 0 16px;
  cursor: pointer;
}

.chip-row {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.filter-chip {
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.82);
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}

.filter-chip.active {
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.36);
}

.result-line {
  margin-top: 10px;
  color: rgba(255,255,255,.52);
  font-size: 12px;
  letter-spacing: .12em;
}

.search-area,
.compact-search-bar {
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.10);
  padding: 10px 7vw;
}

.search-area {
  position: static;
  top: auto;
  z-index: auto;
}

.compact-search-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 80;
  transform: translateY(-105%);
  opacity: 0;
  pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
}

.compact-search-bar.search-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.search-line,
.compact-line {
  display: grid;
  gap: 8px;
  align-items: center;
}

.search-line {
  grid-template-columns: minmax(0, 1fr) auto;
}

.compact-line {
  grid-template-columns: 42px minmax(0, 1fr) auto;
}

.tool-button,
.filter-toggle,
.sort-select {
  height: 36px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.055);
  color: white;
  padding: 0 12px;
  font-size: 13px;
}

.tool-button,
.filter-toggle { cursor: pointer; }

.tool-button.menu-button {
  width: 42px;
  padding: 0;
  font-size: 20px;
  line-height: 1;
}

.search-input {
  width: 100%;
  height: 36px;
  min-width: 0;
  background: rgba(255,255,255,.075);
  border: 1px solid rgba(255,255,255,.16);
  color: white;
  padding: 0 12px;
  font-size: 14px;
  outline: none;
}

.type-row,
.control-row,
.brand-panel,
.support-quick-links {
  margin-top: 7px;
}

.type-row,
.brand-row,
.support-quick-links {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 3px;
}

.control-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.sort-wrap {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  color: rgba(255,255,255,.62);
  font-size: 12px;
}

.sort-select { width: 100%; appearance: auto; }

.brand-panel {
  display: none;
  border-top: 1px solid rgba(255,255,255,.09);
  padding-top: 8px;
}

.search-area.filters-open .brand-panel { display: block; }

.support-quick-links {
  flex-wrap: wrap;
}

.support-quick-links a {
  color: rgba(255,255,255,.72);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.13);
  padding: 7px 9px;
  font-size: 12px;
}

.reset-button {
  height: 34px;
  margin-top: 8px;
}

.result-line {
  margin-top: 0;
  white-space: nowrap;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  letter-spacing: .06em;
}

.view-switch {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.view-toggle {
  min-height: 34px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.76);
  cursor: pointer;
}

.view-toggle.active {
  border-color: rgba(255,255,255,.34);
  background: rgba(255,255,255,.13);
  color: white;
}

.view-panel.hidden {
  display: none !important;
}

.timeline-list {
  max-width: 760px;
  display: grid;
  gap: 26px;
}

.timeline-post {
  background: rgba(14,14,14,.96);
  border: 1px solid rgba(255,255,255,.20);
  box-shadow: 0 20px 48px rgba(0,0,0,.34);
  padding: 13px;
}

.timeline-head {
  display: block;
}

.timeline-store {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: .04em;
}

.timeline-meta {
  margin-top: 5px;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  line-height: 1.6;
}

.timeline-type {
  color: rgba(255,255,255,.86);
  margin-left: 8px;
}

.timeline-images {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.store-post-image-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 10px;
}

.timeline-image {
  position: relative;
  display: block;
  width: 100%;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.12);
  overflow: hidden;
  cursor: zoom-in;
  padding: 0;
}

.timeline-image img {
  width: 100%;
  display: block;
}

.zoom-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,.74);
  border: 1px solid rgba(255,255,255,.24);
  color: white;
  padding: 5px 8px;
  font-size: 12px;
}

.timeline-actions {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}

.timeline-actions a,
.timeline-actions button {
  min-height: 34px;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.045);
  padding: 8px 6px;
  font-size: 12px;
  color: rgba(255,255,255,.88);
  text-align: center;
  cursor: pointer;
}

.simple-store-list { max-width: 760px; display: grid; gap: 10px; }

.store-group-list {
  max-width: 100%;
  display: grid;
  gap: 28px;
}

.store-group {
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(10,10,10,.90);
  padding: 14px;
}

.store-group-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  margin-bottom: 12px;
}

.store-group-name {
  font-size: 16px;
  font-weight: 650;
}

.store-group-meta {
  margin-top: 5px;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  line-height: 1.6;
}

.store-group-link {
  color: rgba(255,255,255,.82);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.16);
  padding: 8px 10px;
  font-size: 12px;
  white-space: nowrap;
}

.store-post-strip {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  padding-bottom: 8px;
}

.store-post-card {
  flex: 0 0 min(88vw, 520px);
  scroll-snap-align: start;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.035);
  padding: 10px;
}

.store-post-meta {
  color: rgba(255,255,255,.70);
  font-size: 12px;
  margin-bottom: 8px;
}

.store-post-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin-top: 8px;
}

.store-post-actions a,
.store-post-actions button {
  min-height: 34px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.88);
  text-align: center;
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
}

@media (min-width: 820px) {
  .store-post-image-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .store-post-card {
    flex-basis: min(48%, 520px);
  }
}

.simple-store-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  text-decoration: none;
  background: rgba(8,8,8,.72);
  border: 1px solid rgba(255,255,255,.10);
  padding: 14px 16px;
}

.simple-store-name { font-weight: 650; }
.simple-store-meta { margin-top: 5px; color: rgba(255,255,255,.50); font-size: 12px; }
.simple-store-date { color: rgba(255,255,255,.58); font-size: 12px; white-space: nowrap; }

.image-count {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(0,0,0,.72);
  border: 1px solid rgba(255,255,255,.22);
  color: white;
  padding: 5px 8px;
  font-size: 12px;
}

.modal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.modal-nav button {
  min-height: 38px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.045);
  color: white;
  padding: 8px 12px;
  cursor: pointer;
}

.modal-counter {
  color: rgba(255,255,255,.62);
  font-size: 13px;
}

.store-toggle {
  width: 100%;
  margin-top: 8px;
  min-height: 36px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.88);
  cursor: pointer;
}

.store-panel {
  display: none;
  margin-top: 8px;
  border-top: 1px solid rgba(255,255,255,.09);
  padding-top: 8px;
}

.search-area:not(.stores-open) .store-panel {
  display: none !important;
}

.search-area.stores-open .store-panel {
  display: grid;
  gap: 8px;
}

.store-panel-card {
  display: grid;
  gap: 5px;
  color: inherit;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.11);
  background: rgba(255,255,255,.035);
  padding: 11px 12px;
}

.store-panel-name {
  font-weight: 650;
}

.store-panel-meta,
.store-panel-link {
  color: rgba(255,255,255,.58);
  font-size: 12px;
}

.support-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.support-group {
  background: rgba(8,8,8,.82);
  border: 1px solid rgba(255,255,255,.11);
  padding: 16px;
}

.support-group h3 {
  margin: 0 0 10px;
  font-size: 15px;
}

.support-group a {
  display: block;
  color: rgba(255,255,255,.78);
  text-decoration: none;
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.nav-overlay {
  position: fixed;
  inset: 0;
  z-index: 320;
  display: none;
  background: rgba(0,0,0,.68);
  backdrop-filter: blur(8px);
}

.nav-overlay.open { display: block; }

.nav-panel {
  width: min(86vw, 340px);
  min-height: 100%;
  background: rgba(7,7,7,.98);
  border-right: 1px solid rgba(255,255,255,.16);
  box-shadow: 22px 0 48px rgba(0,0,0,.44);
  padding: 18px;
}

.nav-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.nav-title {
  letter-spacing: .18em;
  font-size: 13px;
  color: rgba(255,255,255,.72);
}

.nav-close {
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.05);
  color: white;
  cursor: pointer;
  font-size: 20px;
}

.nav-links {
  display: grid;
  gap: 8px;
}

.nav-links a {
  display: block;
  text-decoration: none;
  color: rgba(255,255,255,.88);
  border: 1px solid rgba(255,255,255,.11);
  background: rgba(255,255,255,.035);
  padding: 14px 13px;
  font-size: 15px;
}

main {
  padding: 28px 7vw calc(104px + env(safe-area-inset-bottom));
}

.section-head {
  margin: 34px 0 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}

.section-head h2 {
  margin: 0;
  font-family: "Times New Roman", serif;
  font-weight: 400;
  letter-spacing: .16em;
}

.section-head p {
  margin: 0;
  color: rgba(255,255,255,.48);
  font-size: 13px;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.shop-card {
  display: flex;
  flex-direction: column;
  background: rgba(8,8,8,.8);
  border: 1px solid rgba(255,255,255,.105);
  min-height: 460px;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
  overflow: hidden;
}

.shop-card:hover {
  border-color: rgba(255,255,255,.3);
  transform: translateY(-2px);
}

.thumb-wrap {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: rgba(255,255,255,.045);
  overflow: hidden;
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.no-thumb {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.32);
  letter-spacing: .2em;
  font-size: 12px;
}

.shop-body {
  padding: 18px;
  flex: 1;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: rgba(255,255,255,.48);
  font-size: 12px;
}

.shop-body h3 {
  margin: 22px 0 8px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .06em;
}

.shop-brand {
  color: rgba(255,255,255,.52);
  font-size: 12px;
  letter-spacing: .2em;
}

.badges {
  margin-top: 16px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.badge {
  border: 1px solid rgba(255,255,255,.14);
  padding: 5px 8px;
  font-size: 11px;
  color: rgba(255,255,255,.72);
}

.summary {
  margin-top: 16px;
  color: rgba(255,255,255,.72);
  line-height: 1.75;
  font-size: 13px;
}

.card-footer {
  padding: 0 18px 18px;
  color: rgba(255,255,255,.82);
  letter-spacing: .12em;
  font-size: 13px;
}

.ad-card {
  background:
    linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.14);
  padding: 22px;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.ad-card small {
  color: rgba(255,255,255,.42);
  letter-spacing: .25em;
  font-size: 11px;
}

.ad-card strong {
  margin-top: 12px;
  font-size: 20px;
  letter-spacing: .08em;
}

.ad-card p {
  color: rgba(255,255,255,.62);
  line-height: 1.7;
  font-size: 13px;
}

.store-layout {
  max-width: 1240px;
  margin: 0 auto;
}

.store-header {
  margin-bottom: 24px;
}

.store-title {
  font-size: clamp(34px, 8vw, 60px);
  letter-spacing: .1em;
  font-weight: 500;
  margin: 30px 0 10px;
}

.store-sub {
  color: rgba(255,255,255,.58);
  letter-spacing: .16em;
}

.image-section {
  margin-top: 34px;
}

.image-section h2 {
  font-family: "Times New Roman", serif;
  font-weight: 400;
  letter-spacing: .16em;
}

.image-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;

<script>
const MEDIA_ITEMS = {"ds-honten-single_2060557105317228819_0": {"image_url": "https://pbs.twimg.com/media/HJiRw8bWAAAKfHQ?format=jpg&name=large", "tweet_url": "https://x.com/ds_nipponbashi/status/2060557105317228819", "summary": "ドラゴンスター日本橋本店 4時間 #ポケモンカード SR買取最低保証パワーアップ 5/30(土)〜5/31(日)の2日間限定！！ 買取最低保証 SR → 円 今週末はドラゴンスターがアツい 眠っているSRカード、まとめてお持ち込み大歓迎です 「これも対象かな？」というカードもぜひお持ちください 1 1,761", "type_label": "定額"}};
let currentTweetUrl = "";

function openMedia(id) {
  const item = MEDIA_ITEMS[id];

  if (!item) return;

  currentTweetUrl = item.tweet_url;

  document.getElementById("modalImage").src = item.image_url;
  document.getElementById("modalSummary").textContent = item.summary;
  document.getElementById("modalTweetLink").href = item.tweet_url;
  document.getElementById("tweetEmbed").innerHTML = "";

  document.getElementById("mediaModal").classList.add("open");
}

function closeMedia() {
  document.getElementById("mediaModal").classList.remove("open");
  document.getElementById("tweetEmbed").innerHTML = "";
}

function loadTweetEmbed() {
  if (!currentTweetUrl) return;

  const embed = document.getElementById("tweetEmbed");

  embed.innerHTML = `
    <blockquote class="twitter-tweet">
      <a href="${currentTweetUrl}"></a>
    </blockquote>
  `;

  if (window.twttr && window.twttr.widgets) {
    window.twttr.widgets.load(embed);
  }
}
</script>
