<style>

* {

}

html {

body {

body::before {

body::after {

a {

.logo-mark {

.logo-text {

.logo-sub {

.hero-large {

.hero-title {

.select-card {

}

.select-card small {

  font-size: 11px;
}

.select-card strong {

}

.select-card p {

}

.breadcrumb {

  font-size: 12px;

}

.breadcrumb a {

}

.area-title {
  margin-top: 32px;

  font-size: clamp(34px, 9vw, 62px);

  font-weight: 400;
}

.area-description {

}

.sticky-search {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);

  padding: 14px 7vw;
}

.search-main {

  grid-template-columns: 1fr auto;

}

.chip-row {

  overflow-x: auto;

}

.filter-chip {

  color: rgba(255,255,255,.82);

  border-radius: 999px;

}

.filter-chip.active {

}

  color: rgba(255,255,255,.52);

main {
  padding: 28px 7vw 80px;
}

.section-head {
  margin: 34px 0 18px;

  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}

.section-head h2 {
  margin: 0;
  font-family: "Times New Roman", serif;
  font-weight: 400;
  letter-spacing: .16em;
}

.section-head p {
  margin: 0;
  color: rgba(255,255,255,.48);
  font-size: 13px;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.shop-card {
  display: flex;
  flex-direction: column;
  background: rgba(8,8,8,.8);
  border: 1px solid rgba(255,255,255,.105);
  min-height: 460px;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
  overflow: hidden;
}

.shop-card:hover {
  border-color: rgba(255,255,255,.3);
  transform: translateY(-2px);
}

.thumb-wrap {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: rgba(255,255,255,.045);
  overflow: hidden;
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.no-thumb {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.32);
  letter-spacing: .2em;
  font-size: 12px;
}

.shop-body {
  padding: 18px;
  flex: 1;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: rgba(255,255,255,.48);
  font-size: 12px;
}

.shop-body h3 {
  margin: 22px 0 8px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .06em;
}

.shop-brand {
  color: rgba(255,255,255,.52);
  font-size: 12px;
  letter-spacing: .2em;
}

.badges {
  margin-top: 16px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.badge {
  border: 1px solid rgba(255,255,255,.14);
  padding: 5px 8px;
  font-size: 11px;
  color: rgba(255,255,255,.72);
}

.summary {
  margin-top: 16px;
  color: rgba(255,255,255,.72);
  line-height: 1.75;
  font-size: 13px;
}

.card-footer {
  padding: 0 18px 18px;
  color: rgba(255,255,255,.82);
  letter-spacing: .12em;
  font-size: 13px;
}

.ad-card {
  background:
    linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.14);
  padding: 22px;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.ad-card small {
  color: rgba(255,255,255,.42);
  letter-spacing: .25em;
  font-size: 11px;
}

.ad-card strong {
  margin-top: 12px;
  font-size: 20px;
  letter-spacing: .08em;
}

.ad-card p {
  color: rgba(255,255,255,.62);
  line-height: 1.7;
  font-size: 13px;
}

.store-layout {
  max-width: 1240px;
  margin: 0 auto;
}

.store-header {

}

.store-title {
  font-size: clamp(34px, 8vw, 60px);
  letter-spacing: .1em;

.store-sub {

  letter-spacing: .16em;
}

.image-section {
  margin-top: 34px;

.image-section h2 {
  font-family: "Times New Roman", serif;
  font-weight: 400;

}

.image-grid {

  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.image-card {
  background: rgba(8,8,8,.84);
  border: 1px solid rgba(255,255,255,.11);

  cursor: pointer;
}

.image-card img {

}

.image-info {

}

.image-info p {
  margin: 0;
  color: rgba(255,255,255,.7);
  line-height: 1.7;
  font-size: 13px;
}

.image-info small {
  display: block;
  margin-top: 10px;
  color: rgba(255,255,255,.42);
}

.link-card {
  background: rgba(8,8,8,.82);
  border: 1px solid rgba(255,255,255,.11);
  padding: 22px;
}

.link-card a {
  display: inline-block;
  margin-top: 16px;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.18);
  padding: 12px 16px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.84);
  z-index: 100;
  display: none;
  padding: 20px;
  overflow-y: auto;
}

.modal.open {
  display: block;
}

.modal-inner {

  margin: 0 auto;

  border: 1px solid rgba(255,255,255,.16);

}

.modal-close {

  background: transparent;

.modal-image {

.modal-summary {

}

.modal-actions {

  gap: 10px;
  flex-wrap: wrap;

}

.modal-actions a,
.modal-actions button {

  color: white;
  border: 1px solid rgba(255,255,255,.18);
  padding: 11px 13px;
  text-decoration: none;
  cursor: pointer;
}

.tweet-embed {
  margin-top: 18px;
}

.hidden {

}

@media (max-width: 760px) {

    padding: 30px 18px 24px;
  }

  .hero-large {
    padding: 30px 18px;
  }

  .selector-grid,
  .shop-grid,
  .image-grid {
    grid-template-columns: 1fr;
  }

    grid-template-columns: 1fr;
  }

  .reset-button {
    width: 100%;
  }

  main {
    padding: 24px 18px 72px;
  }

  .section-head {
    display: block;
  }

  .shop-card {
    min-height: auto;
  }

  .thumb-wrap {
    aspect-ratio: 16 / 10;
  }

  .image-grid {
    gap: 26px;
  }
}

</style>
</head>
<body>

<div class="page-shell">
  <section class="hero">
    
<div class="logo-row">

  <div>
    <div class="logo-text">CARDRADAR</div>
    <div class="logo-sub">TRADING CARD PRICE RADAR</div>
  </div>
</div>


    <div class="breadcrumb">
      <a href="../index.html">TOP</a> /
      <a href="../osaka.html">OSAKA</a> /
      <a href="../osaka-nihonbashi.html">NIHONBASHI</a> /
      STORE
    </div>
  </section>

  <main class="store-layout">
    <div class="store-header">
      <h1 class="store-title">GIRAFULLなんば店</h1>
      <div class="store-sub">GIRAFULL / 大阪・日本橋</div>
      <p class="area-description">
        この店舗の買取表画像を大きく表示しています。
        画像をタップすると拡大表示し、必要な場合のみX埋め込みを読み込みます。
      </p>
      <div class="updated">LAST UPDATE : 2026-05-28 00:00:00 UTC</div>
    </div>

    
<section class="image-section">
  <h2>シングル買取</h2>
  <div class="image-grid">
    
<div class="link-card">
  <p class="summary">該当する画像付き投稿が見つかりませんでした。</p>
</div>

  </div>
</section>

    
  </main>
</div>

<div class="modal" id="mediaModal">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeMedia()">閉じる</button>

    <img class="modal-image" id="modalImage" src="" alt="買取表画像">

    <div class="modal-summary" id="modalSummary"></div>

    <div class="modal-actions">
      <a id="modalTweetLink" href="#" target="_blank" rel="noopener noreferrer">元投稿をXで開く</a>
      <button onclick="loadTweetEmbed()">X埋め込みを表示</button>
    </div>

    <div class="tweet-embed" id="tweetEmbed"></div>
  </div>
</div>

<script async src="https://platform.twitter.com/widgets.js"></script>

<script>
const MEDIA_ITEMS = {};
let currentTweetUrl = "";

function openMedia(id) {
  const item = MEDIA_ITEMS[id];

  if (!item) return;

  currentTweetUrl = item.tweet_url;

  document.getElementById("modalImage").src = item.image_url;
  document.getElementById("modalSummary").textContent = item.summary;
  document.getElementById("modalTweetLink").href = item.tweet_url;
  document.getElementById("tweetEmbed").innerHTML = "";

  document.getElementById("mediaModal").classList.add("open");
}

function closeMedia() {
  document.getElementById("mediaModal").classList.remove("open");
  document.getElementById("tweetEmbed").innerHTML = "";
}

function loadTweetEmbed() {
  if (!currentTweetUrl) return;

  const embed = document.getElementById("tweetEmbed");

  embed.innerHTML = `
    <blockquote class="twitter-tweet">
      <a href="${currentTweetUrl}"></a>
    </blockquote>
  `;

  if (window.twttr && window.twttr.widgets) {
    window.twttr.widgets.load(embed);
  }
}
</script>
