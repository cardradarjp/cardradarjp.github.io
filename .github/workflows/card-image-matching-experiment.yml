name: Card image matching experiment
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'GitHub attachment URL for the 4x4 buyback sheet composite (optional)'
        required: false
        default: 'https://github.com/user-attachments/assets/1e80e0c3-8a57-42b8-b7c4-a1ae323892c5'
      index_batch:
        description: 'Batch number if full_index is false'
        required: false
        default: '0'
      match_only:
        description: 'Reuse saved index and only run matching (no image downloads)'
        type: boolean
        required: false
        default: false
      full_index:
        description: 'Index all Japanese card images in one run'
        type: boolean
        required: false
        default: true
      test_branch:
        description: 'Experiment branch'
        required: true
        default: 'experiment/card-image-matching-20261026'
permissions:
  contents: read
jobs:
  reference-download-check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r matching-test/requirements.txt
      - name: Download and decode one reference image
        if: ${{ !inputs.match_only }}
        run: python matching-test/check_reference_download.py
      - name: Restore latest cumulative feature index
        uses: actions/cache/restore@v4
        with:
          path: matching-test/feature-index/
          key: cardradar-partial-index-v3-${{ github.run_id }}
          restore-keys: |
            cardradar-partial-index-v3-
      - name: Check restored feature index
        id: index_check
        shell: bash
        run: |
          if python - <<'PY'
          import glob,numpy as np
          files=glob.glob('matching-test/feature-index/batch_*.npz')
          assert files, 'No cached shards'
          with np.load(files[0]) as d:
              assert d['bits'].ndim==3 and d['bits'].shape[1]==3
              assert d['hist'].ndim==3 and d['hist'].shape[1]==3
          PY
          then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build full Japanese card feature index
        if: ${{ steps.index_check.outputs.available == 'false' || (!inputs.match_only && inputs.full_index) }}
        run: python -u matching-test/build_feature_index.py --all --batch-size 1500 --workers 8
      - name: Build one Japanese card feature index shard
        if: ${{ steps.index_check.outputs.available == 'true' && !inputs.match_only && !inputs.full_index }}
        run: python -u matching-test/build_feature_index.py --batch "${{ inputs.index_batch }}" --batch-size 1500 --workers 8
      - name: Save cumulative feature index
        if: ${{ steps.index_check.outputs.available == 'false' || !inputs.match_only }}
        uses: actions/cache/save@v4
        with:
          path: matching-test/feature-index/
          key: cardradar-partial-index-v3-${{ github.run_id }}
      - name: Prepare 25 query crops from GitHub image attachment
        if: inputs.image_url != ''
        env:
          CARD_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python -m pip install Pillow
          python matching-test/prepare_queries.py --image-url "$CARD_IMAGE_URL"
      - name: Install Japanese OCR support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn
          python -m pip install pytesseract
      - name: Run matcher only when user card crops are available
        run: |
          if [ -d matching-test/queries ] && ls matching-test/queries/* >/dev/null 2>&1; then
            python matching-test/match_feature_index.py
            python matching-test/ocr_rerank.py
            python matching-test/orb_rerank.py
          else
            echo "25 query card images are not in this branch yet; no recognition accuracy claimed."
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-experiment-results
          path: |
            matching-test/results/
            matching-test/feature-index/*.json
          if-no-files-found: ignore
