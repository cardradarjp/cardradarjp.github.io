name: Card image matching experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r matching-test/requirements.txt
      - name: Download and decode one reference image
        run: python matching-test/check_reference_download.py
      - name: Match cards only when input images exist
        run: |
          if [ -d matching-test/queries ] && [ -d matching-test/references ]; then
            python matching-test/test_matching.py
          else
            echo "Matching inputs not yet supplied; download/decode test only."
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-experiment-results
          path: matching-test/results/
          if-no-files-found: ignore
