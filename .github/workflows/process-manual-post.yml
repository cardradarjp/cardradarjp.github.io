name: Process manual CardRadar post

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: github.actor == 'cardradarjp' && (startsWith(github.event.issue.title, '[CardRadar登録]') || startsWith(github.event.issue.title, '[CardRadar一括登録]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse and append posts
        id: register
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          event = json.loads(Path(os.environ['EVENT_PATH']).read_text(encoding='utf-8'))
          body = event['issue'].get('body') or ''
          blocks = [part.strip() for part in re.split(r'^---\s*$', body, flags=re.MULTILINE) if part.strip()]

          def field(block, name):
              match = re.search(rf'^{re.escape(name)}:\s*(.+)$', block, re.MULTILINE)
              return match.group(1).strip() if match else ''

          def fetch_oembed(url):
              canonical = url.replace('https://x.com/', 'https://twitter.com/', 1)
              query = urllib.parse.urlencode({
                  'url': canonical,
                  'omit_script': 'true',
                  'dnt': 'true',
                  'theme': 'dark',
                  'align': 'center',
              })
              endpoint = f'https://publish.twitter.com/oembed?{query}'
              request = urllib.request.Request(endpoint, headers={'User-Agent': 'CardRadar/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  return payload.get('html') or '', ''
              except Exception as exc:
                  return '', f'{type(exc).__name__}: {exc}'

          candidates = []
          for block in blocks:
              url = field(block, 'URL')
              store = field(block, 'STORE')
              category = field(block, 'CATEGORY')
              account = field(block, 'ACCOUNT')
              status_id = field(block, 'STATUS_ID')
              if not any([url, store, category, account, status_id]):
                  continue
              if not re.fullmatch(r'https://x\.com/[^/]+/status/\d+', url):
                  raise SystemExit(f'Invalid X post URL: {url}')
              if not re.fullmatch(r'\d+', status_id):
                  raise SystemExit(f'Invalid status ID: {status_id}')
              if not all([store, category, account]):
                  raise SystemExit('Missing required field')
              candidates.append({'url':url,'store':store,'category':category,'account':account,'statusId':status_id})

          if not candidates:
              raise SystemExit('No posts found')

          path = Path('manual_posts.json')
          items = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
          known = {str(item.get('statusId')) for item in items}
          added = 0
          duplicates = 0
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          for candidate in candidates:
              if candidate['statusId'] in known:
                  duplicates += 1
                  continue
              html, error = fetch_oembed(candidate['url'])
              if html:
                  candidate['oembedHtml'] = html
              if error:
                  candidate['oembedError'] = error
              candidate['registeredAt'] = now
              items.append(candidate)
              known.add(candidate['statusId'])
              added += 1

          if added:
              path.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              print(f'added={added}', file=fh)
              print(f'duplicates={duplicates}', file=fh)
          PY

      - name: Commit registration
        if: steps.register.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_posts.json
          git commit -m "Register manual CardRadar posts"
          git push origin main

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          ADDED: ${{ steps.register.outputs.added }}
          DUPLICATES: ${{ steps.register.outputs.duplicates }}
        run: |
          gh issue comment "$NUMBER" --body "登録完了：追加 ${ADDED}件、重複スキップ ${DUPLICATES}件。"
          gh issue close "$NUMBER" --reason completed
