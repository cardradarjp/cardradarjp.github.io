<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardRadar｜大阪エリア</title>
<meta name="description" content="CardRadarは、ポケカのシングル買取・BOX買取・定額買取・PSA買取・公式Web買取表・相場確認を探せるサイトです。">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #050505;
  color: #f5f5f5;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 15% 13%, rgba(255,255,255,.13), transparent 17%),
    radial-gradient(circle at 22% 25%, rgba(255,255,255,.045), transparent 23%),
    linear-gradient(90deg, rgba(255,255,255,.025), transparent 35%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012), rgba(255,255,255,.012) 1px, transparent 1px, transparent 5px);
  opacity: .8;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent 0%, transparent 70%, rgba(255,255,255,.027) 73%, transparent 77%),
    linear-gradient(90deg, transparent 0%, transparent 80%, rgba(255,255,255,.02) 82%, transparent 86%),
    linear-gradient(180deg, #080808 0%, #030303 100%);
  opacity: .95;
  z-index: -3;
}

a {
  color: inherit;
}

.page-shell {
  min-height: 100vh;
}

.hero {
  padding: 36px 7vw 30px;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-mark {
  font-family: "Times New Roman", serif;
  font-size: 58px;
  letter-spacing: -.16em;
  line-height: .85;
  text-shadow: 0 0 24px rgba(255,255,255,.18);
}

.logo-text {
  font-family: "Times New Roman", serif;
  letter-spacing: .36em;
  font-size: 24px;
  font-weight: 400;
}

.logo-sub {
  margin-top: 5px;
  color: rgba(255,255,255,.48);
  letter-spacing: .28em;
  font-size: 11px;
}

.hero-large {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 36px 7vw;
}

.hero-title {
  margin-top: 42px;
  font-family: "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(36px, 9vw, 76px);
  letter-spacing: .18em;
  line-height: 1.1;
}

.hero-copy {
  margin-top: 24px;
  color: rgba(255,255,255,.78);
  line-height: 2;
  letter-spacing: .1em;
}

.selector-grid {
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.select-card {
  display: block;
  text-decoration: none;
  background: rgba(8,8,8,.76);
  border: 1px solid rgba(255,255,255,.12);
  padding: 28px;
  min-height: 160px;
  transition: border-color .15s ease, transform .15s ease;
}

.select-card:hover {
  border-color: rgba(255,255,255,.32);
  transform: translateY(-2px);
}

.select-card small {
  display: block;
  color: rgba(255,255,255,.45);
  letter-spacing: .28em;
  font-size: 11px;
}

.select-card strong {
  display: block;
  margin-top: 18px;
  font-size: 24px;
  letter-spacing: .12em;
  font-weight: 500;
}

.select-card p {
  margin: 16px 0 0;
  color: rgba(255,255,255,.62);
  font-size: 13px;
  line-height: 1.7;
}

.breadcrumb {
  margin-top: 24px;
  color: rgba(255,255,255,.5);
  font-size: 12px;
  letter-spacing: .12em;
}

.breadcrumb a {
  color: rgba(255,255,255,.7);
  text-decoration: none;
}

.area-title {
  margin-top: 32px;
  font-family: "Times New Roman", serif;
  font-size: clamp(34px, 9vw, 62px);
  letter-spacing: .18em;
  font-weight: 400;
}

.area-description {
  max-width: 720px;
  color: rgba(255,255,255,.72);
  line-height: 1.9;
  letter-spacing: .08em;
}

.sticky-search {
  position: static;
  top: auto;
  z-index: auto;
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.10);
  padding: 14px 7vw;
}

.search-main {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.search-main input {
  width: 100%;
  height: 48px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  padding: 0 14px;
  font-size: 15px;
  outline: none;
}

.reset-button {
  height: 48px;
  border: 1px solid rgba(255,255,255,.16);
  background: transparent;
  color: white;
  padding: 0 16px;
  cursor: pointer;
}

.chip-row {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.filter-chip {
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.82);
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}

.filter-chip.active {
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.36);
}

.result-line {
  margin-top: 10px;
  color: rgba(255,255,255,.52);
  font-size: 12px;
  letter-spacing: .12em;
}

.search-area,
.compact-search-bar {
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.10);
  padding: 10px 7vw;
}

.search-area {
  position: static;
  top: auto;
  z-index: auto;
}

.compact-search-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 80;
  transform: translateY(-105%);
  opacity: 0;
  pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
}

.compact-search-bar.search-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.search-line,
.compact-line {
  display: grid;
  gap: 8px;
  align-items: center;
}

.search-line {
  grid-template-columns: minmax(0, 1fr) auto;
}

.compact-line {
  grid-template-columns: 42px minmax(0, 1fr) auto;
}

.tool-button,
.filter-toggle,
.sort-select {
  height: 36px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.055);
  color: white;
  padding: 0 12px;
  font-size: 13px;
}

.tool-button,
.filter-toggle { cursor: pointer; }

.tool-button.menu-button {
  width: 42px;
  padding: 0;
  font-size: 20px;
  line-height: 1;
}

.search-input {
  width: 100%;
  height: 36px;
  min-width: 0;
  background: rgba(255,255,255,.075);
  border: 1px solid rgba(255,255,255,.16);
  color: white;
  padding: 0 12px;
  font-size: 14px;
  outline: none;
}

.type-row,
.control-row,
.brand-panel,
.support-quick-links {
  margin-top: 7px;
}

.type-row,
.brand-row,
.support-quick-links {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 3px;
}

.control-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.sort-wrap {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  color: rgba(255,255,255,.62);
  font-size: 12px;
}

.sort-select { width: 100%; appearance: auto; }

.brand-panel {
  display: none;
  border-top: 1px solid rgba(255,255,255,.09);
  padding-top: 8px;
}

.search-area.filters-open .brand-panel { display: block; }

.support-quick-links {
  flex-wrap: wrap;
  align-items: center;
  color: rgba(255,255,255,.50);
  font-size: 12px;
}

.support-quick-links a {
  color: rgba(255,255,255,.72);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.13);
  padding: 7px 9px;
  font-size: 12px;
}

.reset-button {
  height: 34px;
  margin-top: 8px;
}

.result-line {
  margin-top: 0;
  white-space: nowrap;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  letter-spacing: .06em;
}

.view-switch {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.view-toggle {
  min-height: 34px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.76);
  cursor: pointer;
}

.view-toggle.active {
  border-color: rgba(255,255,255,.34);
  background: rgba(255,255,255,.13);
  color: white;
}

.store-view-tools {
  display: flex;
  justify-content: flex-start;
  margin-top: 10px;
}

.store-range-toggle {
  display: inline-flex;
  gap: 6px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.035);
}

.store-range-button {
  min-height: 30px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(255,255,255,.68);
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

.store-range-button.active {
  border-color: rgba(255,255,255,.28);
  background: rgba(255,255,255,.13);
  color: #fff;
}

.view-panel.hidden {
  display: none !important;
}

.timeline-list {
  max-width: 760px;
  display: grid;
  gap: 26px;
}

.timeline-post {
  background: rgba(14,14,14,.96);
  border: 1px solid rgba(255,255,255,.20);
  box-shadow: 0 20px 48px rgba(0,0,0,.34);
  padding: 13px;
}

.timeline-head {
  display: block;
}

.timeline-store {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: .04em;
}

.timeline-meta {
  margin-top: 5px;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  line-height: 1.6;
}

.timeline-type {
  color: rgba(255,255,255,.86);
  margin-left: 8px;
}

.timeline-images {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.store-post-image-list {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  padding-bottom: 8px;
}

.store-post-image-list .store-post-image {
  flex: 0 0 100%;
  scroll-snap-align: start;
}

.scroll-aware {
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.22) rgba(255,255,255,.06);
}

.scroll-aware.can-scroll-left {
  box-shadow: inset 18px 0 18px -18px rgba(255,255,255,.32);
}

.scroll-aware.can-scroll-right {
  box-shadow: inset -18px 0 18px -18px rgba(255,255,255,.32);
}

.scroll-aware.can-scroll-left.can-scroll-right {
  box-shadow:
    inset 18px 0 18px -18px rgba(255,255,255,.32),
    inset -18px 0 18px -18px rgba(255,255,255,.32);
}

.scroll-progress {
  display: none;
  width: max-content;
  margin: 6px 0 0 6px;
  padding: 4px 8px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.055);
  color: rgba(255,255,255,.72);
  font-size: 11px;
  line-height: 1.2;
  pointer-events: none;
}

.scroll-progress.is-visible {
  display: inline-block;
}

.store-post-strip + .scroll-progress,
.store-post-image-list + .scroll-progress {
  margin: 6px 0 0;
}

.timeline-image {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  width: 100%;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.12);
  overflow: hidden;
  cursor: zoom-in;
  padding: 0;
}

.timeline-image img {
  width: 100%;
  flex: 0 0 100%;
  display: block;
}

.timeline-image.is-landscape,
.image-card.is-landscape {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.timeline-image.is-landscape > img,
.image-card.is-landscape > img {
  width: 100%;
  max-width: none;
}

.landscape-split {
  display: none;
  flex: 0 0 100%;
}

.landscape-mode-switch {
  display: none;
  flex: 0 0 100%;
  gap: 6px;
  margin: 7px 0 0 6px;
  align-items: center;
  flex-wrap: wrap;
}

.is-landscape .landscape-mode-switch {
  display: flex;
}

.landscape-mode-button {
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.055);
  color: rgba(255,255,255,.75);
  padding: 5px 8px;
  font-size: 11px;
  line-height: 1.2;
  cursor: pointer;
}

.landscape-mode-button.is-active {
  border-color: rgba(255,255,255,.42);
  background: rgba(255,255,255,.15);
  color: #fff;
}

.landscape-slice {
  position: relative;
  background: rgba(255,255,255,.035);
}

.landscape-slice-frame {
  display: block;
  width: 100%;
  overflow: hidden;
}

.landscape-slice-frame img {
  width: 200%;
  max-width: none;
  display: block;
}

.landscape-slice.is-right .landscape-slice-frame img {
  transform: translateX(-50%);
}

.landscape-mode-quarter .landscape-slice-frame {
  aspect-ratio: var(--landscape-panel-ratio, 1.6);
}

.landscape-mode-quarter .landscape-slice-frame img {
  width: 200%;
}

.landscape-mode-quarter .landscape-slice.is-top-right .landscape-slice-frame img {
  transform: translateX(-50%);
}

.landscape-mode-quarter .landscape-slice.is-bottom-left .landscape-slice-frame img {
  transform: translateY(-50%);
}

.landscape-mode-quarter .landscape-slice.is-bottom-right .landscape-slice-frame img {
  transform: translate(-50%, -50%);
}

.landscape-slice-label {
  display: inline-block;
  background: rgba(0,0,0,.74);
  border: 1px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.88);
  margin: 0 0 6px;
  padding: 5px 8px;
  font-size: 12px;
}

.landscape-hint {
  display: none;
  background: rgba(0,0,0,.74);
  border: 1px solid rgba(255,255,255,.24);
  color: rgba(255,255,255,.9);
  margin: 6px 0 0 6px;
  padding: 5px 8px;
  font-size: 12px;
}

.is-landscape .landscape-hint {
  display: inline-block;
}

.zoom-badge {
  position: static;
  display: inline-block;
  background: rgba(0,0,0,.74);
  border: 1px solid rgba(255,255,255,.24);
  color: white;
  margin: 6px 0 0 6px;
  padding: 5px 8px;
  font-size: 12px;
}

.timeline-actions {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}

.timeline-actions a,
.timeline-actions button {
  min-height: 34px;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.045);
  padding: 8px 6px;
  font-size: 12px;
  color: rgba(255,255,255,.88);
  text-align: center;
  cursor: pointer;
}

.store-timeline-post .timeline-actions {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.store-group-list {
  max-width: 100%;
  display: grid;
  gap: 24px;
}

.store-group {
  border: 1px solid rgba(255,255,255,.16);
  background: linear-gradient(180deg, rgba(18,18,18,.94), rgba(8,8,8,.94));
  padding: 13px 12px 14px;
}

.store-group-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  margin-bottom: 12px;
}

.store-group-name {
  font-size: 16px;
  font-weight: 650;
}

.store-group-meta {
  margin-top: 5px;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  line-height: 1.6;
}

.store-group-link {
  color: rgba(255,255,255,.82);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.16);
  padding: 8px 10px;
  font-size: 12px;
  white-space: nowrap;
}

.store-post-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  padding: 2px 2px 10px;
}

.store-post-card {
  flex: 0 0 min(92vw, 560px);
  scroll-snap-align: start;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.018);
  padding: 6px;
}

.store-post-card.range-hidden {
  display: none;
}

.store-post-meta {
  color: rgba(255,255,255,.62);
  font-size: 11px;
  line-height: 1.5;
  margin: 0 2px 6px;
}

.store-post-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  padding: 0 2px;
}

.store-post-actions a,
.store-post-actions button {
  min-height: 30px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.028);
  color: rgba(255,255,255,.76);
  text-align: center;
  text-decoration: none;
  font-size: 11px;
  cursor: pointer;
  padding: 6px 10px;
  flex: 0 0 auto;
}

.store-post-card .timeline-image {
  background: rgba(0,0,0,.72);
  border-color: rgba(255,255,255,.09);
}

.store-post-card .zoom-badge,
.store-post-card .image-count,
.store-post-card .landscape-hint {
  font-size: 11px;
  padding: 4px 7px;
  color: rgba(255,255,255,.76);
  background: rgba(0,0,0,.58);
}

@media (min-width: 820px) {
  .store-post-card {
    flex-basis: min(52%, 600px);
  }
}

@media (min-width: 761px) {
  .timeline-image.is-landscape.landscape-mode-quarter > img,
  .image-card.is-landscape.landscape-mode-quarter > img,
  .modal-image-wrap.is-landscape.landscape-mode-quarter > .modal-image {
    display: none;
  }

  .is-landscape.landscape-mode-quarter .landscape-split {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
}

.image-count {
  position: static;
  display: inline-block;
  background: rgba(0,0,0,.72);
  border: 1px solid rgba(255,255,255,.22);
  color: white;
  margin: 6px 0 0 6px;
  padding: 5px 8px;
  font-size: 12px;
}

.modal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.modal-nav button {
  min-height: 38px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.045);
  color: white;
  padding: 8px 12px;
  cursor: pointer;
}

.modal-counter {
  color: rgba(255,255,255,.62);
  font-size: 13px;
}

.store-toggle {
  width: 100%;
  margin-top: 8px;
  min-height: 36px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.88);
  cursor: pointer;
}

.store-panel {
  display: none;
  margin-top: 8px;
  border-top: 1px solid rgba(255,255,255,.09);
  padding-top: 8px;
}

.search-area:not(.stores-open) .store-panel {
  display: none !important;
}

.search-area.stores-open .store-panel {
  display: grid;
  gap: 8px;
}

.store-panel-card {
  display: grid;
  gap: 5px;
  color: inherit;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.11);
  background: rgba(255,255,255,.035);
  padding: 11px 12px;
}

.store-panel-card.is-waiting {
  opacity: .62;
  border-style: dashed;
}

.store-panel-name {
  font-weight: 650;
}

.store-panel-meta,
.store-panel-link {
  color: rgba(255,255,255,.58);
  font-size: 12px;
}

.store-panel-link {
  margin-top: 2px;
}

.support-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.support-group {
  background: rgba(8,8,8,.82);
  border: 1px solid rgba(255,255,255,.11);
  padding: 16px;
}

.support-group h3 {
  margin: 0 0 10px;
  font-size: 15px;
}

.support-group a {
  display: block;
  color: rgba(255,255,255,.78);
  text-decoration: none;
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.nav-overlay {
  position: fixed;
  inset: 0;
