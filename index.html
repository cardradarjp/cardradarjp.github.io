<style>
body {
    font-family: system-ui, sans-serif;
    background: #f3f4f6;
    margin: 0;
    color: #111827;
}

header {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    padding: 34px 20px;
}

.header-inner {
    max-width: 980px;
    margin: 0 auto;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 0;
}

.lead {
    margin: 10px 0 0;
    color: #d1d5db;
    font-size: 15px;
}

.meta {
    margin-top: 16px;
    display: inline-block;
    background: rgba(255,255,255,0.12);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 13px;
    color: #e5e7eb;
}

main {
    max-width: 980px;
    margin: 0 auto;
    padding: 26px 14px 40px;
}

.summary {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.07);
}

.summary h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.summary p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
    line-height: 1.7;
}

.shop {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 28px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.shop-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 14px;
    margin-bottom: 18px;
}

.shop h2 {
    margin: 0;
    font-size: 21px;
}

.badge {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 13px;
    margin-bottom: 8px;
    font-weight: 600;
}

.count {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    color: #374151;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    white-space: nowrap;
}

.tweet {
    margin: 0 auto 28px;
    max-width: 560px;
}

.empty {
    color: #6b7280;
    background: #f9fafb;
    padding: 14px;
    border-radius: 12px;
}

footer {
    text-align: center;
    color: #6b7280;
    padding: 34px 20px;
    font-size: 13px;
}

@media (max-width: 600px) {
    header {
        padding: 28px 16px;
    }

    .logo {
        font-size: 28px;
    }

    .shop-head {
        display: block;
    }

    .count {
        display: inline-block;
        margin-top: 10px;
    }
}
</style>
