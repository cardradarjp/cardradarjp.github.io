<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>買取リスト 画像確認</title><style>:root{--b:#f5f5f7;--c:#fff;--t:#111;--s:#6e6e73;--l:#ddd;--ok:#34c759;--ng:#ff3b30;--hold:#ff9f0a;--chip:#efeff4}@media(prefers-color-scheme:dark){:root{--b:#000;--c:#1c1c1e;--t:#f5f5f7;--s:#aaa;--l:#38383a;--chip:#2c2c2e}}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:0 12px 28px}.h{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--b) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:max(10px,env(safe-area-inset-top)) 0 10px}h1{font-size:21px;margin:0 0 5px}.help{font-size:11px;color:var(--s);margin-bottom:8px}.stats,.tool,.card{background:var(--c);border:1px solid var(--l);border-radius:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.st{text-align:center}.n{font-weight:800;font-size:18px}.lab{font-size:10px;color:var(--s)}.tool{padding:9px;margin-top:8px}.nav,.acts{display:grid;gap:8px}.nav{grid-template-columns:1fr 1fr}.acts{grid-template-columns:1fr 1fr 1fr;margin-top:8px}button,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px;font-weight:750}.ghost{background:var(--chip);color:var(--t);border:1px solid var(--l)}.ok{background:var(--ok);color:#fff}.ng{background:var(--ng);color:#fff}.hold{background:var(--hold);color:#fff}.card{padding:14px;margin-top:10px}.pos{font-size:11px;color:var(--s)}.name{font-size:24px;font-weight:850;margin:4px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--chip);padding:5px 8px;border-radius:999px;font-size:12px}.proof{margin-top:12px;border:1px solid var(--l);border-radius:13px;overflow:hidden;background:#111}.ph{padding:8px 10px;background:var(--c);font-size:12px;color:var(--s);display:flex;justify-content:space-between}.proof img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#111}.open{display:block;text-align:center;padding:10px;background:var(--c);color:var(--t);text-decoration:none;border-top:1px solid var(--l);font-size:13px}.meta{margin-top:10px;font-size:13px;color:var(--s);line-height:1.5}textarea{width:100%;margin-top:10px;border:1px solid var(--l);border-radius:11px;padding:10px;background:var(--c);color:var(--t);min-height:65px}.copy{width:100%;margin-top:9px}.err{padding:16px;color:#c62828}</style></head><body><div class="w"><div class="h"><h1>元画像と候補名を照合</h1><div class="help">まずIMG_0800・0801の実画像で動作確認中です。画像と候補が同じなら「合っている」、違えば「違う」。</div><div class="stats"><div class="st"><div class="n" id="all">-</div><div class="lab">対象</div></div><div class="st"><div class="n" id="okc">0</div><div class="lab">合っている</div></div><div class="st"><div class="n" id="ngc">0</div><div class="lab">違う</div></div><div class="st"><div class="n" id="hc">0</div><div class="lab">あとで</div></div></div><div class="tool"><div class="nav"><button class="ghost" id="prev">← 前へ</button><button class="ghost" id="next">次へ →</button></div><div class="acts"><button class="ng" id="no">違う</button><button class="ok" id="yes">合っている</button><button class="hold" id="later">あとで</button></div></div></div><main class="card" id="card" hidden><div class="pos" id="pos"></div><div class="name" id="name"></div><div class="chips"><span class="chip" id="noid"></span><span class="chip" id="rar"></span><span class="chip" id="code"></span><span class="chip" id="qty"></span><span class="chip" id="srcchip"></span></div><div class="proof"><div class="ph"><span id="src"></span><span>元画像</span></div><img id="img" alt="照合元画像"><a class="open" id="open" target="_blank" rel="noopener">画像だけ開く</a></div><div class="meta" id="meta"></div><textarea id="memo" placeholder="違う場合のメモなど"></textarea><button class="ghost copy" id="copy">結果をコピー</button></main><div id="err"></div></div><script>const RAW='https://raw.githubusercontent.com/cardradarjp/cardradarjp.github.io/00ddd46c6760ae292b43388d4ee3ba3bfcc80eca/buyback-list.html',R=[[113,127,'IMG_0800'],[128,142,'IMG_0801']],K='buyback_review_test_20260826';let D=[],i=0,S={};const $=s=>document.querySelector(s);try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch{}function src(n){for(const[a,b,s]of R)if(n>=a&&n<=b)return s;return''}function extract(t){let p=t.indexOf('const D='),s=t.indexOf('[',p),d=0,q=false,e=false;if(p<0||s<0)throw Error('data');for(let i=s;i<t.length;i++){let c=t[i];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false}else{if(c==='"')q=true;else if(c==='[')d++;else if(c===']'&&!--d)return JSON.parse(t.slice(s,i+1))}}throw Error('data')}function save(){localStorage.setItem(K,JSON.stringify(S));stats()}function stats(){let v=Object.values(S);$('#all').textContent=D.length;$('#okc').textContent=v.filter(x=>x.s==='y').length;$('#ngc').textContent=v.filter(x=>x.s==='n').length;$('#hc').textContent=v.filter(x=>x.s==='h').length}function render(){let z=D[i],s=src(z[0]),u='assets/review-hq/'+s+'.jpg?v=20260826-1345';$('#card').hidden=false;$('#pos').textContent=`${i+1} / ${D.length}`;$('#name').textContent=z[1];$('#noid').textContent='No.'+z[0];$('#rar').textContent=z[3]||'-';$('#code').textContent=z[4]||'-';$('#qty').textContent=z[2]+'枚';$('#srcchip').textContent=s;$('#src').textContent='照合元 '+s;$('#img').src=u;$('#open').href=u;$('#meta').textContent=[z[7],z[8],z[9],z[10]].filter(Boolean).join(' ／ ');$('#memo').value=S[z[0]]?.m||''}function set(st){let z=D[i];S[z[0]]={s:st,m:$('#memo').value};save();if(i<D.length-1)i++;render()}$('#yes').onclick=()=>set('y');$('#no').onclick=()=>set('n');$('#later').onclick=()=>set('h');$('#prev').onclick=()=>{if(i>0)i--;render()};$('#next').onclick=()=>{if(i<D.length-1)i++;render()};$('#memo').onchange=()=>{let z=D[i];S[z[0]]={s:S[z[0]]?.s||'',m:$('#memo').value};save()};$('#copy').onclick=async()=>{let t=Object.entries(S).sort((a,b)=>a[0]-b[0]).map(([n,v])=>`${n}\t${v.s==='y'?'合っている':v.s==='n'?'違う':'あとで'}\t${v.m||''}`).join('\n');try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch{prompt('コピーしてください',t)}};(async()=>{try{let r=await fetch(RAW,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D=extract(await r.text()).filter(z=>src(z[0]));stats();render()}catch(e){$('#err').innerHTML='<div class="err">読み込みに失敗しました。Safariで再読み込みしてください。</div>'}})();</script></body></html>
