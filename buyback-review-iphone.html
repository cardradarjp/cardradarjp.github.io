<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>買取リスト 画像確認UI</title>
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--text:#111;--sub:#6e6e73;--line:#ddd;--ok:#34c759;--ng:#ff3b30;--hold:#ff9f0a;--chip:#efeff4}
    @media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#aaa;--line:#38383a;--chip:#2c2c2e}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:0 auto;padding:0 12px 32px}.sticky{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:max(10px,env(safe-area-inset-top)) 0 10px}h1{font-size:22px;margin:2px 0 8px}.sub{font-size:12px;color:var(--sub);line-height:1.5}.stats,.toolbar,.card,.rowbox{background:var(--card);border:1px solid var(--line);border-radius:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;margin-top:10px}.stat{text-align:center}.num{font-size:20px;font-weight:800}.lab{font-size:11px;color:var(--sub)}.toolbar{padding:10px;margin-top:10px;display:grid;gap:8px}.toolbar-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}textarea{min-height:78px;resize:vertical}.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:12px 10px;font-weight:700;color:#fff}.ok{background:var(--ok)}.ng{background:var(--ng)}.hold{background:var(--hold)}.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:14px;margin-top:12px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:23px;font-weight:800;line-height:1.25}.status-pill{padding:6px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:700;white-space:nowrap}.status-ok{color:var(--ok)}.status-ng{color:var(--ng)}.status-hold{color:var(--hold)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{background:var(--chip);padding:6px 10px;border-radius:999px;font-size:12px}.proof{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111}.proof-head{padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;justify-content:space-between}.proof img{display:block;width:100%;height:min(56vh,480px);object-fit:contain;background:#111}.detail-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.rowbox{padding:10px 12px}.rowbox .k{font-size:11px;color:var(--sub);margin-bottom:4px}.rowbox .v{font-size:15px;line-height:1.45;word-break:break-word}.export{margin-top:12px}.tiny{font-size:11px;color:var(--sub);margin-top:6px}@media (min-width:640px){.detail-grid{grid-template-columns:1fr 1fr}.toolbar-row{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="sticky">
    <h1>元画像と候補名を照合</h1>
    <div class="sub">元画像を見ながら、現在のカード名・型番・レアリティ・枚数が合っているかだけ確認してください。結果はこのiPhoneに自動保存されます。</div>
    <div class="stats">
      <div class="stat"><div class="num" id="countAll">-</div><div class="lab">対象</div></div>
      <div class="stat"><div class="num" id="countOk">0</div><div class="lab">合っている</div></div>
      <div class="stat"><div class="num" id="countNg">0</div><div class="lab">違う</div></div>
      <div class="stat"><div class="num" id="countHold">0</div><div class="lab">あとで</div></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-row"><select id="scope"><option value="proof">画像つきのみ</option><option value="all">すべて</option><option value="unanswered">未回答のみ</option></select><input id="jump" inputmode="numeric" placeholder="No.へジャンプ"><button class="ghost" id="jumpBtn" type="button">移動</button></div>
      <div class="nav"><button class="ghost" id="prevBtn" type="button">← 前へ</button><button class="ghost" id="nextBtn" type="button">次へ →</button></div>
      <div class="btns"><button class="ng" id="ngBtn" type="button">違う</button><button class="ok" id="okBtn" type="button">合っている</button><button class="hold" id="holdBtn" type="button">あとで</button></div>
    </div>
  </section>
  <section class="card" id="viewer" hidden>
    <div class="head"><div><div class="tiny" id="positionText">-</div><div class="title" id="cardName">-</div></div><div class="status-pill" id="statusPill">未回答</div></div>
    <div class="chips"><span class="chip" id="cardNo">No.-</span><span class="chip" id="cardRare">-</span><span class="chip" id="cardCode">-</span><span class="chip" id="cardQty">-枚</span><span class="chip" id="cardPrice">¥-</span></div>
    <div class="proof" id="proofBox"><div class="proof-head"><span id="proofLabel">照合元画像</span><span>タップで拡大</span></div><a id="proofLink" target="_blank" rel="noopener noreferrer"><img id="proofImg" alt="照合元画像"></a></div>
    <div class="detail-grid"><div class="rowbox"><div class="k">技・識別 / 補足</div><div class="v" id="cardMemo">-</div></div><div class="rowbox"><div class="k">買取参考</div><div class="v" id="cardSource">-</div></div><div class="rowbox"><div class="k">確認メモ</div><div class="v"><textarea id="note" placeholder="例：名前違い、ミラー違い、枚数違い"></textarea></div></div><div class="rowbox"><div class="k">使い方</div><div class="v">画像と表示内容が同じなら「合っている」。違えば「違う」。迷うものは「あとで」。判定後は自動で次へ進みます。</div></div></div>
    <div class="export"><button class="ghost" id="copyBtn" type="button">結果をコピー</button></div>
  </section>
</div>
<script>
const RAW='https://raw.githubusercontent.com/cardradarjp/cardradarjp.github.io/00ddd46c6760ae292b43388d4ee3ba3bfcc80eca/buyback-list.html';
const ranges=[[113,127,'IMG_0800'],[128,142,'IMG_0801'],[143,157,'IMG_0802'],[158,172,'IMG_0803'],[173,187,'IMG_0804'],[188,201,'IMG_0805'],[202,213,'IMG_0806'],[214,227,'IMG_0807'],[228,237,'IMG_0808'],[238,247,'IMG_0810']];
const storageKey='buyback_review_iphone_20260826';let allData=[],filtered=[],idx=0,state=loadState();const $=s=>document.querySelector(s),viewer=$('#viewer'),cardName=$('#cardName'),positionText=$('#positionText'),statusPill=$('#statusPill'),cardNo=$('#cardNo'),cardRare=$('#cardRare'),cardCode=$('#cardCode'),cardQty=$('#cardQty'),cardPrice=$('#cardPrice'),cardMemo=$('#cardMemo'),cardSource=$('#cardSource'),proofBox=$('#proofBox'),proofImg=$('#proofImg'),proofLabel=$('#proofLabel'),proofLink=$('#proofLink'),note=$('#note'),countAll=$('#countAll'),countOk=$('#countOk'),countNg=$('#countNg'),countHold=$('#countHold');
function loadState(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}function saveState(){localStorage.setItem(storageKey,JSON.stringify(state));updateStats()}function extract(t){let p=t.indexOf('const D='),s=t.indexOf('[',p),d=0,qq=false,e=false;if(p<0||s<0)throw Error('data not found');for(let i=s;i<t.length;i++){let c=t[i];if(qq){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')qq=false}else{if(c==='"')qq=true;else if(c==='[')d++;else if(c===']'){d--;if(!d)return JSON.parse(t.slice(s,i+1))}}}throw Error('data incomplete')}function srcFor(n){for(const [a,b,s] of ranges)if(n>=a&&n<=b)return s;return''}function fix(arr){for(const z of arr){if(z[0]===134&&z[1]==='サーファー'){z[2]=2;z[6]=z[5]*2}}return arr.filter(z=>z[1]!=='リーリエの決心').sort((a,b)=>a[0]-b[0])}function proofUrl(src){return`assets/review/${src}.svg`}function current(){return filtered[idx]}function statusLabel(v){if(v==='ok')return'合っている';if(v==='ng')return'違う';if(v==='hold')return'あとで';return'未回答'}function statusClass(v){if(v==='ok')return'status-ok';if(v==='ng')return'status-ng';if(v==='hold')return'status-hold';return''}function updateStats(){const values=Object.values(state).map(v=>v.status);countAll.textContent=filtered.length||allData.length||0;countOk.textContent=values.filter(v=>v==='ok').length;countNg.textContent=values.filter(v=>v==='ng').length;countHold.textContent=values.filter(v=>v==='hold').length}
function applyFilter(){const scope=$('#scope').value;filtered=allData.filter(row=>{const hasProof=!!srcFor(row[0]),st=state[row[0]]?.status;if(scope==='proof')return hasProof;if(scope==='all')return true;if(scope==='unanswered')return!st;return true});if(idx>=filtered.length)idx=Math.max(0,filtered.length-1);updateStats();render()}
function render(){if(!filtered.length){viewer.hidden=true;return}const z=current();viewer.hidden=false;const no=z[0],name=z[1],qty=z[2],rare=z[3],code=z[4],price=z[5],sub=z[6],memo=z[7],s1=z[8],s2=z[9],s3=z[10],src=srcFor(no),st=state[no]?.status||'';positionText.textContent=`${idx+1} / ${filtered.length}`;cardName.textContent=name;statusPill.textContent=statusLabel(st);statusPill.className='status-pill '+statusClass(st);cardNo.textContent='No.'+no;cardRare.textContent=rare||'レアリティ不明';cardCode.textContent=code||'型番なし';cardQty.textContent=(qty??'-')+'枚';cardPrice.textContent='¥'+Number(price||0).toLocaleString();cardMemo.textContent=[memo,`小計 ¥${Number(sub||0).toLocaleString()}`].filter(Boolean).join(' ／ ');cardSource.textContent=[s1,s2,s3].filter(Boolean).join(' ／ ')||'-';note.value=state[no]?.note||'';if(src){proofBox.hidden=false;proofLabel.textContent='照合元 '+src;proofImg.src=proofUrl(src);proofLink.href=proofUrl(src)}else{proofBox.hidden=true}}
function setStatus(status){const z=current();if(!z)return;const no=z[0];state[no]={status,note:note.value||''};saveState();if(idx<filtered.length-1)idx++;render()}function move(delta){if(!filtered.length)return;idx=Math.min(filtered.length-1,Math.max(0,idx+delta));render()}function jump(){const v=Number($('#jump').value);if(!v)return;let found=filtered.findIndex(r=>r[0]===v);if(found>=0){idx=found;render();return}if(allData.some(r=>r[0]===v)){$('#scope').value='all';applyFilter();found=filtered.findIndex(r=>r[0]===v);if(found>=0){idx=found;render()}}}
async function copyResults(){const lines=['No\t判定\tメモ'];for(const [no,val] of Object.entries(state).sort((a,b)=>Number(a[0])-Number(b[0])))lines.push(`${no}\t${statusLabel(val.status)}\t${(val.note||'').replace(/\n/g,' ')}`);const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);alert('結果をコピーしました')}catch{prompt('コピーしてください',txt)}}
(async function(){try{const res=await fetch(RAW,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);allData=fix(extract(await res.text()));$('#okBtn').onclick=()=>setStatus('ok');$('#ngBtn').onclick=()=>setStatus('ng');$('#holdBtn').onclick=()=>setStatus('hold');$('#prevBtn').onclick=()=>move(-1);$('#nextBtn').onclick=()=>move(1);$('#jumpBtn').onclick=jump;$('#copyBtn').onclick=copyResults;$('#scope').onchange=()=>{idx=0;applyFilter()};note.onchange=()=>{const z=current();if(!z)return;const no=z[0];state[no]={status:state[no]?.status||'',note:note.value||''};saveState()};applyFilter()}catch(err){document.body.innerHTML='<div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">読み込みに失敗しました。Safariで再読み込みしてください。<br><small>'+String(err)+'</small></div>'}})();
</script>
</body>
</html>
