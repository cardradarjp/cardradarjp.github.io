const RAW='https://raw.githubusercontent.com/cardradarjp/cardradarjp.github.io/00ddd46c6760ae292b43388d4ee3ba3bfcc80eca/buyback-list.html',COR='/assets/review/corrected-0800-0810.json?v=20260827-0824';let D=[];const q=document.querySelector('#q'),r=document.querySelector('#r'),o=document.querySelector('#o'),L=document.querySelector('#list'),S=document.querySelector('#st'),E=document.querySelector('#e'),ER=document.querySelector('#err'),TC=document.querySelector('#tc'),TQ=document.querySelector('#tq'),TV=document.querySelector('#tv'),x=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function extract(t){let p=t.indexOf('const D='),s=t.indexOf('[',p),d=0,qq=false,e=false;if(p<0||s<0)throw Error('data not found');for(let i=s;i<t.length;i++){let c=t[i];if(qq){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')qq=false}else{if(c==='"')qq=true;else if(c==='[')d++;else if(c===']'&&!--d)return JSON.parse(t.slice(s,i+1))}}throw Error('data incomplete')}
function totals(){TC.textContent=D.length.toLocaleString();TQ.textContent=D.reduce((s,z)=>s+Number(z[2]||0),0).toLocaleString();TV.textContent='¥'+D.reduce((s,z)=>s+Number(z[6]||0),0).toLocaleString()}

function R(){let t=q.value.trim().toLowerCase(),a=D.filter(z=>(!r.value||z[3]===r.value)&&(!t||(z[1]+' '+z[4]+' '+z[7]+' '+(z[13]||'')).toLowerCase().includes(t)));a.sort((A,B)=>o.value==='n'?A[0]-B[0]:o.value==='p'?B[5]-A[5]||A[0]-B[0]:B[6]-A[6]||A[0]-B[0]);let c=0,s=0;L.innerHTML=a.map(z=>{c+=+z[2];s+=+z[6];return `<article class=i><div class=top><div class=title><div class=n>No.${z[0]}</div><div class=name>${x(z[1])}</div></div><div class=qty>${z[2]}枚</div></div><div class=chips><span>${x(z[3])}</span><span>${x(z[4])}</span>${z[12]?'<span>AR最低200円換算</span>':''}${z[13]?`<span>${x(z[13])}</span>`:''}</div>${z[7]?`<div class=d>${x(z[7])}</div>`:''}<div class=pbox><div><div class=L>買取目安</div><div class=p>¥${(+z[5]).toLocaleString()}</div>${z[11]?`<div class=L>平均 ¥${(+z[11]).toLocaleString()}</div>`:''}</div><div><div class=L>${z[2]}枚なら</div><div class=sub>¥${(+z[6]).toLocaleString()}</div></div></div><div class=src>${x(z[8])} ／ ${x(z[9])} ／ ${x(z[10])}</div></article>`}).join('');S.textContent=`${a.length}種類・${c}枚 ／ 小計 ¥${s.toLocaleString()}`;E.style.display=a.length?'none':'block'}
async function start(){try{let [br,cr]=await Promise.all([fetch(RAW,{cache:'no-store'}),fetch(COR,{cache:'no-store'})]);if(!br.ok||!cr.ok)throw Error('HTTP');let base=extract(await br.text()),cor=await cr.json();let ar=base.filter(z=>z[0]<=112&&(z[3]==='AR'||z[3]==='AR仕様')).map(z=>[...z,'既存AR確認済み']);D=[...ar,...cor];D.forEach(z=>{z[6]=+z[5]*+z[2]});totals();opts();q.oninput=R;r.onchange=R;o.onchange=R;R()}catch(e){S.textContent='読み込みに失敗しました';ER.innerHTML='<div class="err">確認済みデータを取得できませんでした。Safariで再読み込みしてください。</div>'}}start();
