<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>買取リスト 所有確認</title><style>:root{--b:#f5f5f7;--c:#fff;--t:#111;--s:#6e6e73;--l:#ddd;--a:#07f;--y:#16803d;--n:#c62828;--h:#efeff4}@media(prefers-color-scheme:dark){:root{--b:#000;--c:#1c1c1e;--t:#f5f5f7;--s:#aaa;--l:#38383a;--a:#0a84ff;--y:#30d158;--n:#ff453a;--h:#2c2c2e}}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:620px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}h1{font-size:20px;margin:0 0 8px}.topline{display:flex;justify-content:space-between;font-size:12px;color:var(--s)}.bar{height:7px;background:var(--l);border-radius:99px;overflow:hidden;margin:7px 0 9px}.bar i{display:block;height:100%;width:0;background:var(--a);transition:.2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.card{background:var(--c);border:1px solid var(--l)}.stat{border-radius:11px;padding:8px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--s)}.card{border-radius:18px;padding:18px 16px;margin-top:10px;min-height:330px;display:flex;flex-direction:column;justify-content:space-between}.num{font-size:12px;color:var(--s)}.name{font-size:30px;line-height:1.15;font-weight:850;margin:7px 0 12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:14px;font-weight:700;background:var(--h);border-radius:99px;padding:7px 10px}.spec{font-size:14px;color:var(--s);margin-top:12px;line-height:1.4}.warn{display:none;font-size:12px;color:#9a6700;margin-top:10px;font-weight:700}.qtyrow{border-top:1px solid var(--l);padding-top:15px;margin-top:18px;display:flex;justify-content:space-between;align-items:center}.ql{font-size:12px;color:var(--s)}.step{display:flex;align-items:center;gap:10px}.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--l);background:var(--h);color:var(--t);font-size:24px}.q{font-size:25px;font-weight:850;min-width:44px;text-align:center}.price{font-size:11px;color:var(--s);margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.actions button{border:0;border-radius:15px;padding:17px 8px;color:#fff;font-size:18px;font-weight:850}#no{background:var(--n)}#yes{background:var(--y)}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.nav button,.out button{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:12px;padding:11px 7px}.state{text-align:center;font-size:12px;color:var(--s);min-height:18px;margin-top:8px}.done{display:none;background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px 16px;margin-top:10px}.done h2{margin:0 0 8px}.done p{font-size:14px;color:var(--s);line-height:1.5}.out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.hidden{display:none!important}.err{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:16px;margin-top:10px;color:var(--n);line-height:1.5}.reset{width:100%;border:0;background:none;color:var(--n);font-size:12px;padding:18px}</style></head><body><div class="w"><h1>所有カードを高速チェック</h1><div class="topline"><span id="prog">候補を取得中…</span><span id="save">自動保存</span></div><div class="bar"><i id="bar"></i></div><div class="stats"><div class="stat"><b id="keep">0</b><span>持ってる</span></div><div class="stat"><b id="remove">0</b><span>持ってない</span></div><div class="stat"><b id="val">¥0</b><span>確認済み見込み額</span></div></div><div id="err"></div><section class="card hidden" id="card"><div><div class="num" id="num"></div><div class="name" id="name"></div><div class="chips"><span class="chip" id="rar"></span><span class="chip" id="code"></span></div><div class="spec" id="spec"></div><div class="warn" id="warn">同名カードが複数あります。型番・レアリティも確認してください。</div></div><div class="qtyrow"><div><div class="ql">持っている枚数</div><div class="price" id="price"></div></div><div class="step"><button id="minus">−</button><div class="q" id="qty"></div><button id="plus">＋</button></div></div></section><div class="actions hidden" id="actions"><button id="no">持ってない</button><button id="yes">持ってる</button></div><div class="nav hidden" id="nav"><button id="prev">← 前へ</button><button id="later">あとで</button><button id="next">次へ →</button></div><div class="state" id="state"></div><section class="done" id="done"><h2>チェック完了</h2><p id="doneText"></p><div class="out"><button id="copy">結果をコピー</button><button id="share">結果を共有</button></div><p>結果をこのチャットへ貼れば、こちらで持っていないカードを削除し、枚数変更も反映します。</p></section><button class="reset" id="reset">確認状態をすべてリセット</button></div><script>const RAW='https://raw.githubusercontent.com/cardradarjp/cardradarjp.github.io/00ddd46c6760ae292b43388d4ee3ba3bfcc80eca/buyback-list.html',KEY='buybackReview20260825v2';let D=[],S={},idx=0;const $=s=>document.querySelector(s),yen=n=>'¥'+Number(n||0).toLocaleString();function extract(t){let p=t.indexOf('const D='),s=t.indexOf('[',p),d=0,q=false,e=false;if(p<0||s<0)throw Error('data not found');for(let i=s;i<t.length;i++){let c=t[i];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false}else{if(c==='"')q=true;else if(c==='[')d++;else if(c===']'){d--;if(!d)return JSON.parse(t.slice(s,i+1))}}}throw Error('data incomplete')}function loadState(){try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={};$('#save').textContent='保存不可'}}function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#save').textContent='自動保存済み'}catch(e){$('#save').textContent='保存不可'}}function ent(z){return S[z.n]||(S[z.n]={s:'',q:z.q})}function unreviewed(start=0){for(let k=0;k<D.length;k++){let j=(start+k)%D.length;if(!ent(D[j]).s)return j}return-1}function render(){let r=0,k=0,n=0,v=0;for(const z of D){let a=ent(z);if(a.s)r++;if(a.s==='y'){k++;v+=a.q*z.p}if(a.s==='n')n++}$('#prog').textContent=`${r} / ${D.length}種類 確認済み`;$('#bar').style.width=(r/D.length*100)+'%';$('#keep').textContent=k;$('#remove').textContent=n;$('#val').textContent=yen(v);if(r===D.length){$('#card').classList.add('hidden');$('#actions').classList.add('hidden');$('#nav').classList.add('hidden');$('#done').style.display='block';$('#doneText').textContent=`持ってる ${k}種類 / 持ってない ${n}種類 / 見込み額 ${yen(v)}`;return}$('#done').style.display='none';$('#card').classList.remove('hidden');$('#actions').classList.remove('hidden');$('#nav').classList.remove('hidden');let z=D[idx],a=ent(z);$('#num').textContent=`候補 ${idx+1} / ${D.length} ・ No.${z.n}`;$('#name').textContent=z.name;$('#rar').textContent=z.rar||'レアリティ不明';$('#code').textContent=z.code||'型番不明';$('#spec').textContent=z.spec||'';$('#qty').textContent=a.q;$('#price').textContent=`買取目安 ${yen(z.p)} / 枚`;$('#warn').style.display=D.filter(x=>x.name===z.name).length>1?'block':'none';$('#state').textContent=a.s==='y'?'✓ 持ってるで確認済み':a.s==='n'?'× 持ってないで確認済み':'未確認'}function advance(){let j=unreviewed(idx+1);if(j>=0)idx=j;render()}$('#yes').onclick=()=>{ent(D[idx]).s='y';save();advance()};$('#no').onclick=()=>{ent(D[idx]).s='n';save();advance()};$('#later').onclick=()=>{idx=(idx+1)%D.length;render()};$('#prev').onclick=()=>{idx=(idx-1+D.length)%D.length;render()};$('#next').onclick=()=>{idx=(idx+1)%D.length;render()};$('#minus').onclick=()=>{let a=ent(D[idx]);a.q=Math.max(1,a.q-1);save();render()};$('#plus').onclick=()=>{ent(D[idx]).q++;save();render()};function output(){let y=[],n=[],q=[];for(const z of D){let a=ent(z);if(a.s==='y')y.push(z.n);if(a.s==='n')n.push(z.n);if(a.q!==z.q)q.push(z.n+':'+a.q)}return['買取リスト確認 v2','total='+D.length,'keep='+y.join(','),'remove='+n.join(','),'qty='+q.join(',')].join('\n')}async function cp(){let t=output();try{await navigator.clipboard.writeText(t);alert('コピーしました。このチャットに貼り付けてください。')}catch(e){prompt('この内容をコピーしてください',t)}}$('#copy').onclick=cp;$('#share').onclick=async()=>{let t=output();if(navigator.share)try{await navigator.share({title:'買取リスト確認結果',text:t});return}catch(e){}cp()};$('#reset').onclick=()=>{if(confirm('確認結果をすべてリセットしますか？')){S={};save();idx=0;render()}};async function start(){try{loadState();let t=await(await fetch(RAW,{cache:'no-store'})).text(),a=extract(t);D=a.map(z=>({n:z[0],name:z[1],q:z[2],rar:z[3],code:z[4],p:z[5],spec:z[7]}));let j=unreviewed();idx=j>=0?j:0;render()}catch(e){$('#prog').textContent='読み込み失敗';$('#err').innerHTML='<div class="err">候補データを取得できませんでした。ページを再読み込みしてください。</div>'}}start();</script></body></html>
